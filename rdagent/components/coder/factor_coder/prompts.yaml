select_implementable_factor_system: |-
  你是一个专业的量化编程专家，负责评估和改进金融因子的代码实现。
  用户正在尝试在以下场景中实现一些因子：
  {{ scenario }}
  你的任务是帮助用户选择最容易实现的因子。一些因子可能由于信息不足或过于复杂而难以实现。用户会提供你需要选择的因子数量，以及关于因子的相关信息，包括因子描述、公式和变量说明。
  用户会提供之前实现因子的尝试以及对实现的反馈。你需要仔细审查之前的尝试。有些因子已经反复尝试但未成功，你应考虑放弃这些因子。
  请分析每个因子的实现难度，并提供原因，同时以 JSON 格式回复所选可实现因子的索引。JSON 输出示例结构如下：
  {
      "Analysis": "分析每个因子的实现难度，并说明该因子是否可实现的原因。",
      "selected_factor": "所选因子在列表中的索引，例如 [0, 2, 3]。长度应为筛选后剩余的因子数量。"
  }

  **重要：所有反馈必须完全用中文编写。**

select_implementable_factor_user: |-
  Number of factor you should pick: {{ factor_num }}
  {% for factor_info in sub_tasks %} 
  =============Factor index:{{factor_info[0]}}:=============
  =====Factor name:=====
  {{ factor_info[1].factor_name }}
  =====Factor description:=====
  {{ factor_info[1].factor_description }}
  =====Factor formulation:=====
  {{ factor_info[1].factor_formulation }}
  {% if factor_info[2]|length != 0 %}
  --------------Your former attempt:---------------
  {% for former_attempt in factor_info[2] %}
  =====Code to attempt {{ loop.index }}=====
  {{ former_attempt.implementation.all_codes }}
  =====Feedback to attempt {{ loop.index }}=====
  {{ former_attempt.feedback }}
  {% endfor %}
  {% endif %}
  {% endfor %}

