extract_model_formulation_system: |-
    提供本文中提出模型的描述，用 LaTeX 公式以及模型架构编写。格式应如下所示：
    {
        "model_name (The name of the model)": {
            "description": "对模型的详细描述",
            "formulation": "表示模型公式的 LaTeX 表达式",
            "architecture": "对模型架构的详细描述，例如，神经网络层或树结构",
            "variables": {
                "\\hat{y}_u": "节点 u 的预测输出",
                "variable_name_2": "变量 2 的描述",
                "variable_name_3": "变量 3 的描述"
            },
            "hyperparameters": {
                "hyperparameter_name_1": "超参数 1 的值",
                "hyperparameter_name_2": "超参数 2 的值",
                "hyperparameter_name_3": "超参数 3 的值"
            },
            "training_hyperparameters" {  # 所有值仅供参考；您可以自行设定
                "n_epochs": "100",
                "lr": "1e-3",
                "early_stop": 10,
                "batch_size": 256,
                "weight_decay": 1e-4,
            }
            "model_type": "Tabular or TimeSeries or Graph or XGBoost"  # Should be one of "Tabular", "TimeSeries", "Graph", or "XGBoost"
        }
    }
    此类格式内容应以 ```json 开头，以 ``` 结尾，内容应为 JSON 格式。
    **重要：所有模型相关内容必须完全用中文编写，包括模型名称、描述、公式、架构、变量和超参数等。**


evolving_strategy_model_coder:
    system: |-
        用户正尝试在以下场景中实现一些 PyTorch 模型：
        {{ scenario }}
        
        您的代码预期以任何形式与该场景对齐，这意味着用户需要基于输入数据获得模型的预测。
        
        为了帮助您编写正确的代码，用户可能提供多条信息以帮助您编写正确的代码：
        1. 用户可能会为您提供类似模型的正确代码。您应学习这些代码来编写正确的代码。
        2. 用户可能会为您提供先前失败的代码以及相应的代码反馈。该反馈包含执行情况、代码和模型输出值。您应分析反馈并尝试纠正最新的代码。
        3. 用户可能会为您提供关于最新失败代码的建议，以及一些类似的失败-纠正对。每对包含具有相似错误的失败代码及其对应的纠正版本代码。您应学习这些建议以编写正确的代码。
        
        您必须基于您下面提供的最新尝试来编写代码，该尝试包括您之前的代码和代码反馈，您应仔细阅读之前的尝试，并且不得修改之前代码中正确的部分。

        {% if current_code is not none %}
        用户之前已经编写了一些代码。您应基于此代码编写新代码。以下是最新代码：

        ```python
        {{ current_code }}
        ```
        您的代码应与之前的代码非常相似，这意味着您的代码应与之前的代码有百分之九十以上的相似度！您不应修改代码中正确的部分。
        {% else %}
        用户之前没有编写任何代码。您应从头开始编写新代码。
        {% endif %}

        {% if queried_former_failed_knowledge|length != 0 %}
        --------------您之前的最新尝试:---------------
        =====先前实现的代码=====
        {{ queried_former_failed_knowledge[-1].implementation.all_codes }}
        =====对先前实现的反馈=====
        {{ queried_former_failed_knowledge[-1].feedback }}
        {% endif %}
        
        请以以下 JSON 格式响应代码。以下是一个 JSON 输出结构示例：
        {
            "code": "The Python code as a string."
        }
        **重要：所有反馈必须完全用中文编写。代码中的注释信息需要用中文描述。**
        
    user: |-
        --------------目标模型信息:---------------
        {{ model_information_str }}

        {% if queried_similar_successful_knowledge|length != 0 %}
        --------------类似模型的正确代码:---------------
        {% for similar_successful_knowledge in queried_similar_successful_knowledge %}
        =====模型 {{loop.index}}:=====
        {{ similar_successful_knowledge.target_task.get_task_information() }}
        =====代码:=====
        {{ similar_successful_knowledge.implementation.all_codes }}
        {% endfor %}
        {% endif %}

        {% if queried_former_failed_knowledge|length != 0 %}
        --------------先前失败的代码:---------------
        {% for former_failed_knowledge in queried_former_failed_knowledge %}
        =====实现 {{ loop.index }} 的代码=====
        {{ former_failed_knowledge.implementation.all_codes }}
        =====对实现 {{ loop.index }} 的反馈=====
        {{ former_failed_knowledge.feedback }}
        {% endfor %}
        {% endif %}

evaluator_code_feedback:
    system: |-
        用户正尝试在以下场景中实现一些模型：
        {{ scenario }}
        用户将向您提供模型的信息。
        
        您的工作是检查用户的代码是否与模型信息和场景一致。
        用户将提供 Python 源代码以及执行失败时的错误信息。
        用户可能会为您提供参考代码，以便您提供评判。您不得以任何形式向用户泄露参考代码，但您可以使用它来提供评判。

        用户还将用户的代码生成的输出与参考代码的输出进行了比较。用户将为您提供一些比较两个输出的分析结果。您可能会发现代码中的某些错误导致了两个输出之间的差异。

        如果提供了参考代码，您的评判应仅考虑检查用户的代码是否与参考代码一致，因为参考代码肯定是正确的。
        如果没有提供参考代码，您的评判应考虑检查用户的代码对于描述和场景是否合理和正确。

        请注意，您的评判不是为了给用户调试代码。它们将被发送给编码代理以纠正代码。因此，不要提供任何让用户检查的项目，例如"请检查代码第 XXX 行"。

        您的建议不应包含任何代码，只应包含一些清晰简短的提示。请指出代码中非常关键的问题，忽略不重要的问题以避免混淆。如果代码中没有发现重大问题，您可以回复"未发现批评"。

        您应该为您的每条批评提供建议，以帮助用户改进代码。请按以下格式回复批评。以下是输出的示例结构：
        评审意见 1：对评审意见 1 的评审信息
        评审意见 2：对评审意见 2 的评审信息

        **重要：所有反馈必须完全用中文编写。**
    
    user: |-
        --------------模型信息:---------------
        {{ model_information }}
        --------------Python 代码:---------------
        {{ code }}
        --------------执行反馈:---------------
        {{ model_execution_feedback }}
        {% if model_value_feedback is not none %}
        --------------模型值反馈:---------------
        {{ model_value_feedback }}
        {% endif %}
        {% if gt_code is not none %}
        --------------参考 Python 代码:---------------
        {{ gt_code }}
        {% endif %}


evaluator_final_feedback:
    system: |-
        用户正尝试在以下场景中实现一个模型：
        {{ scenario }}
        用户已完成评估并从评估者那里获得了一些反馈。
        评估者运行代码并获取输出，并针对用户的代码和代码输出提供了若干反馈。您应分析反馈，并结合场景和模型描述，对评估结果做出最终决定。最终决定包括模型是否正确实现，如果最终决定为 False，则需提供包含原因和建议的详细反馈。

        实现的最终决定基于以下逻辑进行考虑：
        1. 如果输出值与参考输出值在允许的小容差内完全相同，则认为实现是正确的。
        2. 如果没有提供参考输出值，如果代码执行成功且代码反馈与场景和模型描述一致，则认为实现是正确的。

        请按 JSON 格式回复批评。以下是 JSON 输出的示例结构，请严格遵守该格式：
        {
            "final_decision": True,
            "final_feedback": "最终的反馈消息",
        }
        注意,json中的key必须是final_decision和final_feedback，不能缺少，不能有其他key，不能修改这两个key的名字，不能出现final_eedback等错误的key. final_decision的值必须是布尔值true或者false，final_feedback的值必须是字符串。

        **重要：所有反馈必须完全用中文编写。**
    user: |-
        --------------模型信息:---------------
        {{ model_information }}
        --------------模型执行反馈:---------------
        {{ model_execution_feedback }}
        --------------模型 shape 反馈:---------------
        {{ model_shape_feedback }}
        --------------模型 Code 反馈:---------------
        {{ model_code_feedback }}
        --------------模型值反馈:---------------
        {{ model_value_feedback }}